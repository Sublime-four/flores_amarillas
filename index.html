<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Girasol de Luz</title>
<meta name="description" content="Un girasol hecho de miles de partículas de luz, para la persona que ilumina mis días. Feliz Día de las Flores Amarillas.">
<meta name="theme-color" content="#07060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f4c542;
    --amber: #ff9d3d;
    --cream: #fff6e0;
    --ink: #07060a;
    --ink-2: #14100c;
    --muted: rgba(255, 246, 224, 0.55);
    --line: rgba(244, 197, 66, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--ink);
    color: var(--cream);
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background:
      radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255, 157, 61, 0.12) 0%, rgba(255, 157, 61, 0) 65%),
      radial-gradient(ellipse at 50% 100%, var(--ink-2) 0%, var(--ink) 70%);
  }

  /* Viñeta y grano sutil */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.75) 100%);
    z-index: 1;
  }

  /* ---------- Marco editorial ---------- */
  .frame {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding:
      calc(env(safe-area-inset-top) + clamp(1rem, 3vh, 1.75rem))
      clamp(1rem, 4vw, 2.5rem)
      calc(env(safe-area-inset-bottom) + clamp(1rem, 3vh, 1.75rem));
  }

  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(0.62rem, 1.6vw, 0.72rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: fade 1.2s ease-out 0.4s forwards;
  }
  .meta .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    margin: 0 0.6em;
    vertical-align: middle;
    box-shadow: 0 0 8px var(--gold);
  }

  .corner {
    position: absolute;
    width: clamp(28px, 6vw, 44px);
    height: clamp(28px, 6vw, 44px);
    border-color: var(--line);
    border-style: solid;
    border-width: 0;
    opacity: 0;
    animation: fade 1.4s ease-out 0.6s forwards;
  }
  .corner.tl { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
  .corner.tr { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
  .corner.bl { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
  .corner.br { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
  .corners {
    position: absolute;
    inset: clamp(0.6rem, 2.2vw, 1.25rem);
    pointer-events: none;
  }

  /* ---------- Texto principal ---------- */
  .copy {
    align-self: end;
    text-align: center;
    padding-bottom: clamp(0.5rem, 3vh, 2rem);
  }

  .eyebrow {
    font-size: clamp(0.62rem, 1.7vw, 0.75rem);
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1s ease, transform 1s ease;
  }

  h1 {
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-weight: 400;
    font-size: clamp(1.7rem, 6.2vw, 3.6rem);
    line-height: 1.08;
    margin: 0.5rem auto 0;
    max-width: 18ch;
    letter-spacing: 0.02em;
    color: var(--cream);
    opacity: 0;
    filter: blur(6px);
    letter-spacing: 0.25em;
    transition: opacity 1.6s ease, filter 1.6s ease, letter-spacing 1.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  h1 em {
    font-style: italic;
    font-weight: 400;
    background: linear-gradient(90deg, var(--amber), var(--gold) 45%, #ffe9a6 60%, var(--gold) 75%, var(--amber));
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: -220% 0; } }

  .revealed .eyebrow { opacity: 1; transform: none; }
  .revealed h1 { opacity: 1; filter: blur(0); letter-spacing: 0.02em; }

  .rule {
    width: 0;
    height: 1px;
    margin: clamp(0.8rem, 2.5vh, 1.4rem) auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transition: width 1.4s ease 0.6s;
  }
  .revealed .rule { width: min(220px, 50vw); }

  .compliment {
    position: relative;
    min-height: 2.6em;
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(1.05rem, 3.4vw, 1.5rem);
    line-height: 1.4;
    color: var(--cream);
    max-width: 30ch;
    margin: 0 auto;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .revealed .compliment { opacity: 1; }
  .compliment span {
    display: block;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  .compliment span.out { opacity: 0; transform: translateY(-8px); }
  .compliment span.pre { opacity: 0; transform: translateY(8px); transition: none; }

  .hint {
    margin-top: clamp(0.8rem, 2.5vh, 1.4rem);
    font-size: clamp(0.6rem, 1.6vw, 0.7rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.8s ease 1s;
  }
  .revealed .hint { opacity: 1; animation: breathe 3s ease-in-out 2s infinite; }
  .hint.hide { opacity: 0 !important; animation: none !important; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .counter {
    font-variant-numeric: tabular-nums;
  }

  @keyframes fade { to { opacity: 1; } }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .meta, .corner { animation: none; opacity: 1; }
    h1 em { animation: none; }
    .revealed .hint { animation: none; }
    h1, .eyebrow, .rule, .compliment, .compliment span, .hint { transition: none; }
  }

  @media (max-width: 480px) {
    .meta { letter-spacing: 0.22em; }
    h1 { max-width: 14ch; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="frame" id="frame">
  <div class="meta" aria-hidden="true">
    <span>21 <span class="dot"></span> Septiembre</span>
    <span>Flor <span class="counter" id="counter">01</span></span>
  </div>

  <div class="corners" aria-hidden="true">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
  </div>

  <div class="copy">
    <p class="eyebrow">Día de las flores amarillas</p>
    <h1>Feliz día,<br>eres mi <em>sol</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="compliment" id="compliment" aria-live="polite"><span>Eres mi sol de cada mañana.</span></p>
    <p class="hint" id="hint">Toca para transformar la flor</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d', { alpha: true });
  var frame = document.getElementById('frame');
  var complimentEl = document.getElementById('compliment');
  var hintEl = document.getElementById('hint');
  var counterEl = document.getElementById('counter');

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 0;
  var isSmall = false;

  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ---------- Paleta y sprites ---------- */
  var PALETTE = [
    '#2a1607', '#4a2a10', '#6b4320', '#8a5a26', '#b0752c', // centro: café → ámbar oscuro
    '#e07f24', '#ff9d3d', '#f7b93b', '#f4c542', '#f9d660', // pétalos: ámbar → dorado
    '#ffe38a', '#fff0b8', '#fff6e0'                         // puntas: crema
  ];
  var sprites = [];
  function makeSprites() {
    sprites = PALETTE.map(function (hex) {
      var size = 48;
      var c = document.createElement('canvas');
      c.width = c.height = size;
      var g = c.getContext('2d');
      var grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grd.addColorStop(0, hex);
      grd.addColorStop(0.28, hex);
      grd.addColorStop(0.55, hexAlpha(hex, 0.35));
      grd.addColorStop(1, hexAlpha(hex, 0));
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      return c;
    });
  }
  function hexAlpha(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  /* ---------- Forma del girasol (coordenadas normalizadas, radio máx = 1) ---------- */
  var GOLDEN = 2.399963229728653; // ángulo dorado en radianes
  function buildShape(n, opts) {
    var k = opts.petals;
    var Rc = opts.center;          // radio del centro
    var L = 1 - Rc;                // largo máximo de pétalo
    var pts = new Array(n);
    var nCenter = Math.floor(n * 0.36);
    var nOuter = Math.floor(n * 0.42);
    var i, r, th, u, env, axis, ci, s;

    // Centro: espiral de Fermat (semillas)
    for (i = 0; i < nCenter; i++) {
      r = Rc * Math.sqrt((i + 0.5) / nCenter);
      th = i * GOLDEN;
      var t = r / Rc;
      ci = t < 0.35 ? 0 : t < 0.6 ? 1 : t < 0.8 ? 2 : t < 0.93 ? 3 : 4;
      s = lerp(1.0, 0.75, t);
      pts[i] = { x: r * Math.cos(th), y: r * Math.sin(th), c: ci, s: s };
    }

    // Largo propio de cada pétalo para un aspecto orgánico
    var lengths = [];
    for (i = 0; i < k; i++) lengths.push(rand(0.88, 1.0));

    // Un punto dentro de un pétalo con forma de hoja.
    // f: avance a lo largo del pétalo (0 base, 1 punta); o: desvío angular respecto al eje.
    var petalPoint = function (layerOffset, rMin, len, sharp) {
      var j = Math.floor(Math.random() * k);
      var f = Math.pow(Math.random(), 0.8);
      // semiancho angular: ancho máximo hacia el 40 % del largo, punta afilada
      var halfW = (Math.PI / k) * 0.92 * Math.pow(Math.sin(Math.PI * Math.pow(f, 0.7)), sharp);
      var o = (Math.random() * 2 - 1);
      o = Math.sign(o) * Math.pow(Math.abs(o), 1.25) * halfW;  // más denso cerca del eje
      var angle = j * (Math.PI * 2 / k) + layerOffset + o;
      var rad = rMin + f * len * lengths[j];
      return { r: rad, th: angle, f: f, vein: 1 - Math.abs(o) / (halfW || 1) };
    };

    // Pétalos exteriores
    for (i = nCenter; i < nCenter + nOuter; i++) {
      var q = petalPoint(0, Rc * 0.86, L, opts.sharp);
      var shade = clamp(q.f * 1.1 + q.vein * 0.2 - 0.1, 0, 1);
      ci = 5 + Math.round(shade * 6);   // las puntas llegan a crema suave, no a blanco
      s = lerp(1.05, 0.7, q.f);
      pts[i] = { x: q.r * Math.cos(q.th), y: q.r * Math.sin(q.th), c: ci, s: s };
    }

    // Pétalos interiores (desfasados medio paso, más cortos, más cálidos)
    for (i = nCenter + nOuter; i < n; i++) {
      var q2 = petalPoint(Math.PI / k, Rc * 0.92, L * 0.6, opts.sharp + 0.2);
      ci = 5 + Math.round(clamp(q2.f * 0.9, 0, 1) * 4);
      s = lerp(0.95, 0.65, q2.f);
      pts[i] = { x: q2.r * Math.cos(q2.th), y: q2.r * Math.sin(q2.th), c: ci, s: s };
    }

    // Mezclar para que la transformación sea un remolino y no un desplazamiento en bloque
    for (i = n - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp;
    }
    return pts;
  }

  // sharp: 1 = pétalo ancho tipo girasol, más alto = pétalo más fino
  var VARIANTS = [
    { petals: 21, center: 0.34, sharp: 1.0 },
    { petals: 13, center: 0.30, sharp: 1.1 },
    { petals: 8,  center: 0.28, sharp: 1.3 },
    { petals: 16, center: 0.32, sharp: 1.0 },
    { petals: 5,  center: 0.24, sharp: 1.5 },
    { petals: 24, center: 0.40, sharp: 0.9 },
    { petals: 10, center: 0.26, sharp: 1.2 }
  ];
  var variantIndex = 0;

  /* ---------- Partículas ---------- */
  var N = 0;
  var P = [];        // partículas
  var shape = [];    // objetivos
  var dust = [];     // polvo de fondo
  var rot = 0;       // rotación global de la flor
  var rotSpeed = 0.0009;
  var spring = 0.0;  // fuerza de atracción (arranca en 0 y sube)
  var targetSpring = 0.045;
  var damping = 0.86;
  var pointer = { x: -9999, y: -9999, active: false, radius: 0 };
  var burstUntil = 0;
  var revealed = false;
  var startTime = performance.now();
  var lastFrame = startTime;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    isSmall = W < 600;
    // La flor ocupa el espacio libre entre la cabecera y el bloque de texto
    var copy = document.querySelector('.copy');
    var meta = document.querySelector('.meta');
    var top = meta ? meta.getBoundingClientRect().bottom : 60;
    var bottom = copy ? copy.getBoundingClientRect().top : H * 0.6;
    if (!(bottom > top + 80)) { top = 60; bottom = H * 0.6; }
    var avail = bottom - top;
    R = Math.min(W * (isSmall ? 0.40 : 0.34), avail * 0.42);
    CX = W / 2;
    CY = top + avail * 0.5;
    pointer.radius = Math.max(60, R * 0.45);
    if (reduceMotion) renderStatic();
  }

  function initParticles() {
    N = isSmall ? 1400 : 2400;
    shape = buildShape(N, VARIANTS[variantIndex]);
    P = new Array(N);
    var maxR = Math.max(W, H) * 0.9;
    for (var i = 0; i < N; i++) {
      var a = Math.random() * Math.PI * 2;
      var d = rand(R * 1.2, maxR);
      P[i] = {
        x: CX + Math.cos(a) * d,
        y: CY + Math.sin(a) * d,
        vx: 0, vy: 0,
        ph: Math.random() * Math.PI * 2,
        sz: rand(1.6, 3.2)
      };
    }
    dust = [];
    var nd = isSmall ? 70 : 140;
    for (var k = 0; k < nd; k++) {
      dust.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: rand(-0.06, 0.06), vy: rand(-0.12, -0.03),
        s: rand(0.6, 1.8), a: rand(0.15, 0.55), ph: Math.random() * Math.PI * 2
      });
    }
  }

  function targetOf(i, cos, sin) {
    var t = shape[i];
    return {
      x: CX + R * (t.x * cos - t.y * sin),
      y: CY + R * (t.x * sin + t.y * cos)
    };
  }

  function step(dt) {
    var now = performance.now();
    var elapsed = now - startTime;

    // La atracción sube gradualmente para que la convergencia inicial sea fluida
    if (spring < targetSpring) spring = Math.min(targetSpring, spring + 0.0006 * dt);
    var k = now < burstUntil ? spring * 0.08 : spring;

    rot += rotSpeed * dt;
    var cos = Math.cos(rot), sin = Math.sin(rot);
    var px = pointer.x, py = pointer.y, pr = pointer.radius, pr2 = pr * pr;
    var wobble = 0.35;

    for (var i = 0; i < N; i++) {
      var p = P[i], t = shape[i];
      var tx = CX + R * (t.x * cos - t.y * sin);
      var ty = CY + R * (t.x * sin + t.y * cos);
      var ax = (tx - p.x) * k;
      var ay = (ty - p.y) * k;

      // Respiración sutil
      ax += Math.cos(p.ph + now * 0.0012) * wobble * 0.02;
      ay += Math.sin(p.ph * 1.3 + now * 0.0010) * wobble * 0.02;

      // Repulsión del puntero
      if (pointer.active) {
        var dx = p.x - px, dy = p.y - py;
        var d2 = dx * dx + dy * dy;
        if (d2 < pr2 && d2 > 0.01) {
          var d = Math.sqrt(d2);
          var f = (1 - d / pr) * 1.6;
          ax += (dx / d) * f;
          ay += (dy / d) * f;
        }
      }

      p.vx = (p.vx + ax * dt) * damping;
      p.vy = (p.vy + ay * dt) * damping;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    for (var j = 0; j < dust.length; j++) {
      var q = dust[j];
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.y < -5) { q.y = H + 5; q.x = Math.random() * W; }
      if (q.x < -5) q.x = W + 5; else if (q.x > W + 5) q.x = -5;
    }

    if (!revealed && elapsed > 2600) {
      revealed = true;
      frame.classList.add('revealed');
      scheduleCompliment();
      // El texto cambia de tamaño al revelarse: recalcular el espacio de la flor
      setTimeout(resize, 2000);
    }
  }

  function draw() {
    var now = performance.now();
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);

    // Polvo de fondo
    ctx.fillStyle = '#f4c542';
    for (var j = 0; j < dust.length; j++) {
      var q = dust[j];
      ctx.globalAlpha = q.a * (0.6 + 0.4 * Math.sin(q.ph + now * 0.0015));
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Halo central
    var halo = ctx.createRadialGradient(CX, CY, R * 0.1, CX, CY, R * 1.6);
    halo.addColorStop(0, 'rgba(255, 157, 61, 0.16)');
    halo.addColorStop(0.5, 'rgba(244, 197, 66, 0.06)');
    halo.addColorStop(1, 'rgba(244, 197, 66, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    // Partículas con mezcla aditiva
    ctx.globalCompositeOperation = 'lighter';
    var scale = R / 260; // el tamaño de partícula escala con la flor
    for (var i = 0; i < N; i++) {
      var p = P[i], t = shape[i];
      var s = p.sz * t.s * (1.6 + 0.9 * scale) * (0.9 + 0.1 * Math.sin(p.ph + now * 0.003));
      var spr = sprites[t.c];
      ctx.drawImage(spr, p.x - s, p.y - s, s * 2, s * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop(now) {
    var dt = clamp((now - lastFrame) / 16.667, 0.5, 2.5);
    lastFrame = now;
    step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // Versión sin movimiento: flor ya formada, sin bucle
  function renderStatic() {
    var cos = Math.cos(rot), sin = Math.sin(rot);
    for (var i = 0; i < N; i++) {
      var t = targetOf(i, cos, sin);
      P[i].x = t.x; P[i].y = t.y;
    }
    draw();
  }

  /* ---------- Transformación al tocar ---------- */
  var flowerCount = 1;
  function transform(x, y) {
    hintEl.classList.add('hide');
    variantIndex = (variantIndex + 1 + Math.floor(Math.random() * (VARIANTS.length - 1))) % VARIANTS.length;
    shape = buildShape(N, VARIANTS[variantIndex]);
    flowerCount++;
    counterEl.textContent = (flowerCount < 10 ? '0' : '') + flowerCount;
    nextCompliment(true);

    if (reduceMotion) { renderStatic(); return; }

    burstUntil = performance.now() + 520;
    var ox = typeof x === 'number' ? x : CX;
    var oy = typeof y === 'number' ? y : CY;
    for (var i = 0; i < N; i++) {
      var p = P[i];
      var dx = p.x - ox, dy = p.y - oy;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var force = rand(6, 16) * clamp(1 - d / (R * 2.2), 0.25, 1);
      // Empuje radial con un giro para que parezca un remolino
      p.vx += (dx / d) * force + (-dy / d) * force * 0.6;
      p.vy += (dy / d) * force + (dx / d) * force * 0.6;
    }
    rotSpeed = rand(-0.0016, 0.0016) || 0.0009;
  }

  /* ---------- Cumplidos ---------- */
  var compliments = [
    'Eres mi sol de cada mañana.',
    'Contigo hasta la noche es de día.',
    'Tu sonrisa es mi lugar favorito.',
    'Brillas más que todas las estrellas.',
    'Cada día contigo es una flor amarilla.',
    'Te quiero con toda la luz que tengo.',
    'Eres lo más bonito que me ha pasado.',
    'Mi corazón florece cuando te veo.',
    'Iluminas hasta mis días grises.',
    'Quiero regalarte flores toda la vida.',
    'Eres mi persona favorita.',
    'Gracias por existir en mi vida.'
  ];
  var cIndex = 0;
  var cTimer = null;

  function nextCompliment(immediate) {
    cIndex = (cIndex + 1) % compliments.length;
    var text = compliments[cIndex];
    var current = complimentEl.firstElementChild;
    if (reduceMotion) {
      complimentEl.textContent = '';
      var s0 = document.createElement('span');
      s0.textContent = text;
      complimentEl.appendChild(s0);
    } else {
      current.classList.add('out');
      setTimeout(function () {
        var s = document.createElement('span');
        s.className = 'pre';
        s.textContent = text;
        complimentEl.textContent = '';
        complimentEl.appendChild(s);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { s.classList.remove('pre'); });
        });
      }, 560);
    }
    scheduleCompliment();
  }
  function scheduleCompliment() {
    if (cTimer) clearTimeout(cTimer);
    cTimer = setTimeout(function () { nextCompliment(false); }, 5200);
  }

  /* ---------- Eventos ---------- */
  function onMove(ev) {
    var pt = ev.touches ? ev.touches[0] : ev;
    pointer.x = pt.clientX; pointer.y = pt.clientY; pointer.active = true;
  }
  function onLeave() { pointer.active = false; pointer.x = pointer.y = -9999; }

  window.addEventListener('mousemove', onMove, { passive: true });
  window.addEventListener('mouseleave', onLeave);
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend', onLeave);
  window.addEventListener('touchcancel', onLeave);

  var lastTap = 0;
  window.addEventListener('pointerdown', function (ev) {
    var now = performance.now();
    if (now - lastTap < 350) return; // evita dobles disparos
    lastTap = now;
    transform(ev.clientX, ev.clientY);
  });
  window.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); transform(); }
  });
  window.addEventListener('resize', function () { resize(); });

  /* ---------- Arranque ---------- */
  makeSprites();
  resize();
  initParticles();
  if (reduceMotion) {
    spring = targetSpring;
    renderStatic();
    frame.classList.add('revealed');
    revealed = true;
    scheduleCompliment();
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
